<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>আমার প্রথম ওয়েবসাইট</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }
    header {
      background: #1e88e5;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>স্বাগতম!</h1>
    <p>এটা আমার প্রথম ওয়েবসাইট</p>
  </header>
  <main>
    <div class="card">
      <h2>আমার সম্পর্কে</h2>
      <p>এখানে নিজের কথা লিখুন।</p>
    </div>
    <div class="card">
      <h2>যোগাযোগ</h2>
      <p>এখানে ফোন নম্বর বা ইমেইল লিখুন।</p>
    </div>
  </main>
  <footer>© ২০২৬ আমার ওয়েবসাইট</footer>
</body>
</html>
