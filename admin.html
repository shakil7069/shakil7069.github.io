```html
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ঘরের রান্না | Admin Panel</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fffaf2;
  color: #333;
}

.header {
  background: #176b45;
  color: white;
  padding: 25px 15px;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #00000015;
  margin-bottom: 20px;
}

h2 {
  color: #176b45;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 7px 0 15px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

button {
  border: none;
  background: #176b45;
  color: white;
  padding: 11px 18px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 15px;
}

button:hover {
  background: #104d33;
}

.google-btn {
  background: #4285f4;
  width: 100%;
  font-size: 17px;
  padding: 14px;
}

.logout {
  background: #b42318;
}

.logout:hover {
  background: #8f1c14;
}

.hidden {
  display: none;
}

.user-info {
  margin-bottom: 20px;
  padding: 12px;
  background: #e5f3e9;
  border-radius: 8px;
}

.food-row {
  display: grid;
  grid-template-columns: 1fr 120px 80px 80px;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid #eee;
  padding: 12px 0;
}

.food-row input {
  margin: 0;
}

.delete-btn {
  background: #b42318;
}

.add-box {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #ddd;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;
  background: #e5f3e9;
}

@media(max-width: 650px) {
  .food-row {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>ঘরের রান্না</h1>
  <p>Admin Panel</p>
</div>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">

    <h2>Admin Login</h2>

    <p style="margin-bottom:20px;">
      Google Account দিয়ে Admin Panel-এ প্রবেশ করুন।
    </p>

    <button id="googleLogin" class="google-btn">
      Google দিয়ে Login করুন
    </button>

    <p id="loginMessage" class="message hidden"></p>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden">

    <div class="card">

      <div class="user-info">
        <strong>Logged in:</strong>
        <span id="userEmail"></span>
      </div>

      <button id="logoutBtn" class="logout">
        Logout
      </button>

    </div>


    <div class="card">

      <h2>খাবারের মেনু</h2>

      <div id="foodList"></div>


      <div class="add-box">

        <h3>নতুন খাবার যোগ করুন</h3>

        <label>খাবারের নাম</label>

        <input
          type="text"
          id="newName"
          placeholder="যেমন: গরুর মাংস ও ভাত"
        >

        <label>দাম</label>

        <input
          type="number"
          id="newPrice"
          placeholder="যেমন: 200"
        >

        <label>Emoji</label>

        <input
          type="text"
          id="newEmoji"
          placeholder="যেমন: 🍛"
        >

        <button id="addFoodBtn">
          খাবার যোগ করুন
        </button>

      </div>

      <p id="saveMessage" class="message hidden"></p>

    </div>

  </div>

</div>


<!-- Firebase -->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyC593-xJpaEEacEU25A_AHALiCbiHGHISg",

  authDomain: "ghorer-ranna-292cf.firebaseapp.com",

  projectId: "ghorer-ranna-292cf",

  storageBucket: "ghorer-ranna-292cf.firebasestorage.app",

  messagingSenderId: "469568922954",

  appId: "1:469568922954:web:cfb8e9d590f0b3d3c18db3",

  measurementId: "G-J97D5D14C2"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


/* ==========================================
   এখানে তোমার Firebase-এর Gmail বসাবে
   ========================================== */

const ADMIN_EMAIL = "তোমার-Gmail-এখানে-লিখবে";


const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const googleLogin =
document.getElementById("googleLogin");

const logoutBtn =
document.getElementById("logoutBtn");

const userEmail =
document.getElementById("userEmail");

const loginMessage =
document.getElementById("loginMessage");

const foodList =
document.getElementById("foodList");

const saveMessage =
document.getElementById("saveMessage");


/* =========================
   GOOGLE LOGIN
========================= */

googleLogin.addEventListener("click", async () => {

  try {

    loginMessage.classList.add("hidden");

    const result =
      await signInWithPopup(auth, provider);

    const email =
      result.user.email;

    if (
      !email ||
      email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ) {

      await signOut(auth);

      loginMessage.textContent =
        "এই Gmail দিয়ে Admin Panel ব্যবহার করার অনুমতি নেই।";

      loginMessage.classList.remove("hidden");

      return;
    }

  } catch(error) {

    console.error(error);

    loginMessage.textContent =
      "Login করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";

    loginMessage.classList.remove("hidden");
  }

});


/* =========================
   LOGIN STATE
========================= */

onAuthStateChanged(auth, (user) => {

  if (!user) {

    loginBox.classList.remove("hidden");

    adminPanel.classList.add("hidden");

    return;
  }


  if (
    !user.email ||
    user.email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ) {

    signOut(auth);

    return;
  }


  loginBox.classList.add("hidden");

  adminPanel.classList.remove("hidden");

  userEmail.textContent =
    user.email;

  loadFoods();

});


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener("click", async () => {

  await signOut(auth);

});


/* =========================
   DEFAULT MENU
========================= */

let foods = [

  {
    id: 1,
    name: "ভাত ও ডাল",
    price: 50,
    emoji: "🍚"
  },

  {
    id: 2,
    name: "মাছের তরকারি ও ভাত",
    price: 120,
    emoji: "🐟"
  },

  {
    id: 3,
    name: "মুরগির মাংস ও ভাত",
    price: 150,
    emoji: "🍗"
  },

  {
    id: 4,
    name: "সবজি ভাজি",
    price: 40,
    emoji: "🥗"
  },

  {
    id: 5,
    name: "ডিম ও ভাত",
    price: 80,
    emoji: "🥚"
  },

  {
    id: 6,
    name: "সম্পূর্ণ দুপুরের খাবার",
    price: 180,
    emoji: "🍛"
  }

];


/* =========================
   LOAD FOODS
========================= */

function loadFoods() {

  const saved =
    localStorage.getItem("ghorerRannaFoods");

  if (saved) {

    try {

      foods = JSON.parse(saved);

    } catch(error) {

      console.error(error);

    }

  }

  showFoods();

}


/* =========================
   SHOW FOODS
========================= */

function showFoods() {

  foodList.innerHTML = "";

  foods.forEach((food, index) => {

    const row =
      document.createElement("div");

    row.className = "food-row";

    row.innerHTML = `

      <input
        type="text"
        value="${food.name}"
        data-index="${index}"
        class="food-name"
      >

      <input
        type="number"
        value="${food.price}"
        data-index="${index}"
        class="food-price"
      >

      <input
        type="text"
        value="${food.emoji}"
        data-index="${index}"
        class="food-emoji"
      >

      <button
        class="delete-btn"
        data-index="${index}"
      >
        মুছুন
      </button>

    `;

    foodList.appendChild(row);

  });


  document
    .querySelectorAll(".food-name")
    .forEach(input => {

      input.addEventListener("change", () => {

        const index =
          input.dataset.index;

        foods[index].name =
          input.value;

        saveFoods();

      });

    });


  document
    .querySelectorAll(".food-price")
    .forEach(input => {

      input.addEventListener("change", () => {

        const index =
          input.dataset.index;

        foods[index].price =
          Number(input.value);

        saveFoods();

      });

    });


  document
    .querySelectorAll(".food-emoji")
    .forEach(input => {

      input.addEventListener("change", () => {

        const index =
          input.dataset.index;

        foods[index].emoji =
          input.value;

        saveFoods();

      });

    });


  document
    .querySelectorAll(".delete-btn")
    .forEach(button => {

      button.addEventListener("click", () => {

        const index =
          button.dataset.index;

        foods.splice(index, 1);

        saveFoods();

        showFoods();

      });

    });

}


/* =========================
   SAVE FOODS
========================= */

function saveFoods() {

  localStorage.setItem(
    "ghorerRannaFoods",
    JSON.stringify(foods)
  );

  saveMessage.textContent =
    "মেনু সংরক্ষণ হয়েছে।";

  saveMessage.classList.remove("hidden");

  setTimeout(() => {

    saveMessage.classList.add("hidden");

  }, 2000);

}


/* =========================
   ADD FOOD
========================= */

document
  .getElementById("addFoodBtn")
  .addEventListener("click", () => {

    const name =
      document.getElementById("newName")
      .value.trim();

    const price =
      Number(
        document.getElementById("newPrice")
        .value
      );

    const emoji =
      document.getElementById("newEmoji")
      .value.trim() || "🍛";


    if (!name || !price) {

      alert(
        "খাবারের নাম এবং দাম দিন।"
      );

      return;

    }


    foods.push({

      id: Date.now(),

      name: name,

      price: price,

      emoji: emoji

    });


    saveFoods();

    showFoods();


    document.getElementById("newName")
      .value = "";

    document.getElementById("newPrice")
      .value = "";

    document.getElementById("newEmoji")
      .value = "";

  });

</script>

</body>
</html>
```
