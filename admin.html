```html
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ঘরের রান্না | Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#198754;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{margin:0}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

#loginBox{
    max-width:420px;
    margin:70px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

#loginBox h2{
    text-align:center;
    color:#198754;
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.login-btn{
    width:100%;
    background:#198754;
    color:white;
    margin-top:10px;
}

.error{
    color:#dc3545;
    text-align:center;
    margin-top:12px;
}

#adminPanel{display:none}

.topbar{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.logout{
    background:#dc3545;
    color:white;
}

.add-box{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.add-box h2{
    margin-top:0;
    color:#198754;
}

.add-btn{
    background:#198754;
    color:white;
    margin-top:8px;
}

.food-list{
    display:grid;
    gap:15px;
}

.food-item{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.food-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.food-price{
    color:#198754;
    font-weight:bold;
    margin-bottom:15px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.edit-btn{
    background:#ffc107;
    color:#222;
}

.delete-btn{
    background:#dc3545;
    color:white;
}

.status{
    text-align:center;
    margin:15px 0;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>🍲 ঘরের রান্না - Admin Panel</h1>
</header>


<!-- LOGIN -->

<div id="loginBox">

    <h2>🔐 Admin Login</h2>

    <input
        type="email"
        id="email"
        value="spshakil2023@gmail.com"
        placeholder="User ID / Email"
        autocomplete="username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button class="login-btn" onclick="login()">
        লগইন করুন
    </button>

    <div id="loginError" class="error"></div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel">

<div class="container">

    <div class="topbar">

        <div>
            <strong>👤 Admin Panel</strong>
            <div id="adminEmail"></div>
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>


    <!-- ADD FOOD -->

    <div class="add-box">

        <h2>➕ নতুন খাবার যোগ করুন</h2>

        <input
            type="text"
            id="newName"
            placeholder="খাবারের নাম"
        >

        <input
            type="number"
            id="newPrice"
            placeholder="দাম"
        >

        <input
            type="text"
            id="newEmoji"
            placeholder="Emoji যেমন 🍛"
        >

        <button class="add-btn" onclick="addFood()">
            খাবার যোগ করুন
        </button>

    </div>


    <div id="status" class="status"></div>


    <!-- FOOD LIST -->

    <div class="add-box">

        <h2>🍽️ খাবারের তালিকা</h2>

        <div id="foodList" class="food-list"></div>

    </div>

</div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "AIzaSyC593-xJpaEEacEU25_AHALiCbiHGHISg",

    authDomain: "ghorer-ranna-292cf.firebaseapp.com",

    projectId: "ghorer-ranna-292cf",

    storageBucket: "ghorer-ranna-292cf.firebasestorage.app",

    messagingSenderId: "469568922954",

    appId: "1:469568922954:web:cfb8e9d590f0b3d3c18db3",

    measurementId: "G-J97D5D14C2"
};


/* FIREBASE START */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* ADMIN EMAIL */

const ADMIN_EMAIL = "spshakil2023@gmail.com";


/* DEFAULT MENU */

const defaultMenu = [

    {
        name:"ভাত ও ডাল",
        price:50,
        emoji:"🍚"
    },

    {
        name:"মাছের তরকারি ও ভাত",
        price:120,
        emoji:"🐟"
    },

    {
        name:"মুরগির মাংস ও ভাত",
        price:150,
        emoji:"🍗"
    },

    {
        name:"সবজি ভাজি",
        price:40,
        emoji:"🥗"
    },

    {
        name:"ডিম ও ভাত",
        price:80,
        emoji:"🥚"
    },

    {
        name:"সম্পূর্ণ দুপুরের খাবার",
        price:180,
        emoji:"🍛"
    }

];


/* LOAD MENU */

let menu = JSON.parse(
    localStorage.getItem("ghorerRannaMenu")
);

if(!menu){

    menu = defaultMenu;

    saveMenu();

}


/* SAVE MENU */

function saveMenu(){

    localStorage.setItem(
        "ghorerRannaMenu",
        JSON.stringify(menu)
    );

}


/* LOGIN */

window.login = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");

    error.innerText = "";


    if(!email || !password){

        error.innerText =
            "User ID এবং Password দিন।";

        return;

    }


    if(
        email.toLowerCase()
        !== ADMIN_EMAIL.toLowerCase()
    ){

        error.innerText =
            "এই User ID দিয়ে Admin Panel ব্যবহার করা যাবে না।";

        return;

    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(err){

        console.log(err);

        error.innerText =
            "User ID অথবা Password ভুল।";

    }

};


/* LOGOUT */

window.logout = async function(){

    await signOut(auth);

};


/* AUTH CHECK */

onAuthStateChanged(auth,(user)=>{

    if(user){

        if(
            user.email.toLowerCase()
            !== ADMIN_EMAIL.toLowerCase()
        ){

            signOut(auth);

            return;

        }


        document.getElementById(
            "loginBox"
        ).style.display = "none";


        document.getElementById(
            "adminPanel"
        ).style.display = "block";


        document.getElementById(
            "adminEmail"
        ).innerText =
            user.email;


        renderMenu();

    }

    else{

        document.getElementById(
            "loginBox"
        ).style.display = "block";


        document.getElementById(
            "adminPanel"
        ).style.display = "none";

    }

});


/* ADD FOOD */

window.addFood = function(){

    const name =
        document.getElementById("newName")
        .value.trim();

    const price =
        Number(
            document.getElementById("newPrice")
            .value
        );

    const emoji =
        document.getElementById("newEmoji")
        .value.trim() || "🍽️";


    if(!name){

        showStatus("খাবারের নাম লিখুন।");

        return;

    }


    if(!price || price <= 0){

        showStatus("সঠিক দাম লিখুন।");

        return;

    }


    menu.push({

        name:name,
        price:price,
        emoji:emoji

    });


    saveMenu();

    renderMenu();


    document.getElementById("newName").value = "";
    document.getElementById("newPrice").value = "";
    document.getElementById("newEmoji").value = "";


    showStatus("✅ নতুন খাবার যোগ হয়েছে।");

};


/* SHOW MENU */

function renderMenu(){

    const list =
        document.getElementById("foodList");

    list.innerHTML = "";


    menu.forEach((food,index)=>{

        const div =
            document.createElement("div");

        div.className = "food-item";


        div.innerHTML = `

            <div class="food-title">
                ${food.emoji}
                ${escapeHTML(food.name)}
            </div>

            <div class="food-price">
                দাম: ৳${food.price}
            </div>

            <div class="actions">

                <button
                    class="edit-btn"
                    onclick="editFood(${index})">
                    ✏️ Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteFood(${index})">
                    🗑️ Delete
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* EDIT FOOD */

window.editFood = function(index){

    const food = menu[index];


    const name =
        prompt("খাবারের নাম:",food.name);

    if(name === null) return;


    const price =
        prompt("দাম:",food.price);

    if(price === null) return;


    const emoji =
        prompt("Emoji:",food.emoji);

    if(emoji === null) return;


    if(!name.trim()){

        alert("খাবারের নাম খালি রাখা যাবে না।");

        return;

    }


    if(!price || Number(price) <= 0){

        alert("সঠিক দাম দিন।");

        return;

    }


    menu[index] = {

        name:name.trim(),
        price:Number(price),
        emoji:emoji.trim() || "🍽️"

    };


    saveMenu();

    renderMenu();

    showStatus("✅ খাবারের তথ্য পরিবর্তন হয়েছে।");

};


/* DELETE FOOD */

window.deleteFood = function(index){

    const food = menu[index];


    if(
        !confirm(
            `"${food.name}" মুছে ফেলতে চান?`
        )
    ){

        return;

    }


    menu.splice(index,1);

    saveMenu();

    renderMenu();

    showStatus("🗑️ খাবার মুছে ফেলা হয়েছে।");

};


/* STATUS */

function showStatus(message){

    const status =
        document.getElementById("status");

    status.innerText = message;


    setTimeout(()=>{

        status.innerText = "";

    },3000);

}


/* SECURITY */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
```
